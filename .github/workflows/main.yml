name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "./.git/*" \
          -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            echo "Files in repository:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug
          path: |
            **/build/outputs/apk/debug/*.apk
