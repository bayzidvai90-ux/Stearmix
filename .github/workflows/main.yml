name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Android Project
        run: |
          echo "Project files:"
          ls -la

          echo "Checking required files..."

          test -f "settings.gradle.kts" || test -f "settings.gradle"
          test -d "app"

          echo "Android project found in repository root."

      - name: Prepare Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Handle Google Services
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            echo "Continuing without Google Services configuration."
          fi

      - name: Build Debug APK
        run: |
          echo "Gradle version:"
          gradle --version

          echo "Starting clean build..."
          gradle clean

          echo "Building Debug APK..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
