name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android project
        run: |
          echo "Searching Android project..."
          find . -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Detect project folder
        run: |
          if [ -f "android-project/settings.gradle.kts" ] || [ -f "android-project/settings.gradle" ]; then
            echo "PROJECT_DIR=android-project" >> "$GITHUB_ENV"
          elif [ -f "android-project/Streamix/settings.gradle.kts" ] || [ -f "android-project/Streamix/settings.gradle" ]; then
            echo "PROJECT_DIR=android-project/Streamix" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Disable Google Services if config is missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "google-services.json not found."

            if [ -f "app/build.gradle.kts" ]; then
              sed -i '/com.google.gms.google-services/d' app/build.gradle.kts || true
            fi

            if [ -f "app/build.gradle" ]; then
              sed -i '/com.google.gms.google-services/d' app/build.gradle || true
            fi
          else
            echo "google-services.json found."
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Using Gradle:"
          gradle --version

          gradle clean
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
