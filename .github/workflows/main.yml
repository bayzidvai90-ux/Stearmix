name: Build Streamix BD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        run: |
          if [ -d "android-project" ]; then
            cd android-project
          elif [ -d "app" ] && [ -f "settings.gradle" -o -f "settings.gradle.kts" ]; then
            echo "Project is in repository root"
          else
            echo "Searching for Android project..."
            find . -name "settings.gradle" -o -name "settings.gradle.kts"
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare debug keystore
        run: |
          mkdir -p android-project
          keytool -genkeypair \
            -v \
            -keystore android-project/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          cd android-project
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug
          path: android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
