name: Build Streamix BD APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Find and extract Android project
        id: project
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          # Project already extracted
          if [[ -f "$WORKSPACE/settings.gradle" ||
                -f "$WORKSPACE/settings.gradle.kts" ]]; then
            PROJECT_DIR="$WORKSPACE"
          fi

          # Otherwise extract ZIP
          if [[ -z "$PROJECT_DIR" ]]; then
            ZIP_FILE="$(find "$WORKSPACE" -maxdepth 2 \
              -type f -iname '*.zip' -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            rm -rf "$WORKSPACE/.android-project"
            mkdir -p "$WORKSPACE/.android-project"

            unzip -q -o "$ZIP_FILE" \
              -d "$WORKSPACE/.android-project"
          fi

          # Find Gradle project
          if [[ -z "$PROJECT_DIR" ]]; then
            SETTINGS_FILE="$(find "$WORKSPACE/.android-project" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit || true)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: settings.gradle(.kts) not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          ./gradlew --version

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' \
            -print -quit || true)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
