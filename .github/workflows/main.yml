name: Build Streamix BD APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit || true)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/.android-project"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.android-project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/.android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 9.3.1
        run: |
          set -euxo pipefail

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" --version

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit || true)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
